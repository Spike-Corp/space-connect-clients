// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        // 8.5.1+ required so the AAB aligns uncompressed native libs to 16 KB
        // (Android 15+ 16 KB page size device support).
        // 8.9.0+ required to compile/target Android 16 (API 36); using 8.13.0
        // (max supported API 36.1) for Play Store's Aug/2026 targetSdk requirement.
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }
}
