name: Sign private Android candidate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: spaceconnect-private-android-signing
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'Spike-Corp/space-connect-clients' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, ubuntu-22.04]
    timeout-minutes: 10
    steps:
      - name: Sign fixed local candidate without checkout or upload
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk
          SC_KEYSTORE_PASSWORD: ${{ secrets.SC_KEYSTORE_PASSWORD }}
          SC_KEY_ALIAS: ${{ secrets.SC_KEY_ALIAS }}
          SC_KEY_PASSWORD: ${{ secrets.SC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_NAME" == "kvm-builder" && "$(id -u)" == 0 ]]
          [[ "$(date -u +%F)" == "2026-11-02" ]]
          readonly staging=/root/private-releases/space-connect/0.3.48-beta.1/.signing
          [[ "$(realpath -e "$staging")" == "$staging" ]]
          [[ -O "$staging" && "$(stat -c %a "$staging")" == 700 ]]
          cd "$staging"
          for file in unsigned.apk unsigned.aab; do
            [[ -f "$file" && ! -L "$file" && -O "$file" ]]
            [[ "$(stat -c %a "$file")" == 600 && "$(stat -c %h "$file")" == 1 ]]
          done
          printf '%s  %s\n' \
            576d2a03ac086a10e023976dc4e9bd2ce07eba8878e278b81a3642c8377af25a unsigned.apk \
            48006cbd9f8f10bf028a31f8d025cdadb76d9606731810a7a54c22c3e7201e6e unsigned.aab |
            sha256sum --check --status
          [[ ! -e signed.apk && ! -e signed.aab ]]
          : "${SC_KEYSTORE_PASSWORD:?Signing password unavailable}"
          : "${SC_KEY_ALIAS:?Signing alias unavailable}"
          : "${SC_KEY_PASSWORD:?Key password unavailable}"
          readonly keystore=/root/.config/spaceconnect/space-connect-upload.jks
          readonly apksigner=/opt/android-sdk/build-tools/36.0.0/apksigner
          readonly expected_cert=e0e2ebf1c63ba2b6a2b9359d7b2833312a7fa118ad040a4d64a04fe085d8ddb9
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$SC_KEY_ALIAS" \
            --ks-pass env:SC_KEYSTORE_PASSWORD --key-pass env:SC_KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out signed.apk unsigned.apk
          "$JAVA_HOME/bin/jarsigner" -keystore "$keystore" \
            -storepass:env SC_KEYSTORE_PASSWORD -keypass:env SC_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar signed.aab unsigned.aab "$SC_KEY_ALIAS"
          "$apksigner" verify --print-certs signed.apk > apk-verification.txt
          apk_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-verification.txt)
          [[ "$apk_cert" == "$expected_cert" ]]
          "$JAVA_HOME/bin/jarsigner" -verify signed.aab > aab-verification.txt
          grep -q '^jar verified\.$' aab-verification.txt
          aab_cert=$("$JAVA_HOME/bin/keytool" -printcert -jarfile signed.aab |
            sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$aab_cert" == "$expected_cert" ]]
          chmod 600 signed.apk signed.aab
          echo 'Existing signing identity verified. Files retained only on this private host.'
