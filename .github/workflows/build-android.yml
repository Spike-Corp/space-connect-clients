name: Build Android (AAB)

# Builds the signed Play Store bundle (nonRoot flavor, release) for Space Connect.
# The upload keystore is injected from repo secrets and never committed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  android:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Android SDK Env
        run: |
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "PATH=/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:$PATH" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode upload keystore
        run: |
          mkdir -p /root/.config/spaceconnect
          echo "${{ secrets.SC_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cp "$RUNNER_TEMP/upload.jks" /root/.config/spaceconnect/space-connect-upload.jks
          echo "SC_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release AAB
        working-directory: android
        env:
          SC_KEYSTORE_PASSWORD: ${{ secrets.SC_KEYSTORE_PASSWORD }}
          SC_KEY_ALIAS: ${{ secrets.SC_KEY_ALIAS }}
          SC_KEY_PASSWORD: ${{ secrets.SC_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:bundleNonRootRelease -x lintVitalNonRootRelease --no-daemon --stacktrace

      - name: Stage artifact
        working-directory: android
        run: |
          VERSION=$(grep -E 'versionName' app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          SRC=app/build/outputs/bundle/nonRootRelease/app-nonRoot-release.aab
          OUT="SpaceConnect-${VERSION}-release.aab"
          cp "$SRC" "$OUT"
          echo "Built $OUT"; ls -la "$OUT"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: space-connect-android-aab
          path: android/SpaceConnect-*.aab
          if-no-files-found: error

      # A AAB acima é só pra Play Store (não instala direto). O download direto
      # do site (sideload, fora da Play Store) usa um APK de verdade, então
      # geramos os dois com o MESMO keystore/assinatura já configurado acima.
      - name: Build release APK (direct download)
        working-directory: android
        env:
          SC_KEYSTORE_PASSWORD: ${{ secrets.SC_KEYSTORE_PASSWORD }}
          SC_KEY_ALIAS: ${{ secrets.SC_KEY_ALIAS }}
          SC_KEY_PASSWORD: ${{ secrets.SC_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleNonRootRelease -x lintVitalNonRootRelease --no-daemon --stacktrace

      - name: Stage APK artifact
        working-directory: android
        run: |
          VERSION=$(grep -E 'versionName' app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          SRC=$(ls app/build/outputs/apk/nonRoot/release/*.apk | head -n1)
          OUT="SpaceConnect-${VERSION}-android.apk"
          cp "$SRC" "$OUT"
          echo "Built $OUT"; ls -la "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: space-connect-android-apk
          path: android/SpaceConnect-*.apk
          if-no-files-found: error
