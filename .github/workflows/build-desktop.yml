name: Build Desktop Clients

# Builds the Space Connect desktop client (Qt / Moonlight fork) for
# Windows x64, macOS universal (x86_64 + arm64) and Linux (AppImage x86_64).
#
# macOS DMGs produced here are ad-hoc signed (not Apple-notarized). To ship a
# notarized build, set the SIGNING_IDENTITY / NOTARY_KEYCHAIN_PROFILE secrets
# and scripts/generate-dmg.sh will sign + notarize automatically.

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: [self-hosted, Windows, x64]
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch launcher upload endpoint
        # launcherapi.cpp apontava o upload pra /api/user/session/upload (JWT do site)
        # com token launcher → 401 "User not found". Garante a rota launcher no binário
        # mesmo se o checkout vier de commit antigo sem o fix.
        shell: cmd
        run: |
          powershell -NoProfile -Command "(Get-Content app/backend/launcherapi.cpp -Raw) -replace [regex]::Escape('kApiBase.resolved(QUrl(QStringLiteral("""/api/user/session/upload""")))'), 'kApiBase.resolved(QUrl(QStringLiteral("""session/upload""")))' | Set-Content app/backend/launcherapi.cpp -NoNewline"
          findstr /C:"session/upload" app\backend\launcherapi.cpp || exit /b 1

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Build (Release, x64)
        shell: cmd
        run: |
          qmake moonlight-qt.pro CONFIG+=release || exit /b 1
          scripts\jom.exe release || exit /b 1

      - name: Deploy
        shell: cmd
        run: |
          mkdir deploy || exit /b 1
          copy /Y app\release\SpaceConnect.exe deploy\ || exit /b 1
          copy /Y libs\windows\lib\x64\*.dll deploy\ || exit /b 1
          copy /Y AntiHooking\release\AntiHooking.dll deploy\ || exit /b 1
          rem Discord Rich Presence: sem a discord-rpc.dll no pacote, o Discord_Initialize
          rem morre silenciosamente e o status nunca aparece (windeployqt nao cobre DLLs nao-Qt)
          copy /Y libs\windows\lib\x64\discord-rpc.dll deploy\ || exit /b 1
          copy /Y app\SDL_GameControllerDB\gamecontrollerdb.txt deploy\ || exit /b 1
          windeployqt --release --qmldir app\gui --no-opengl-sw --no-sql --no-system-d3d-compiler --no-system-dxc-compiler --skip-plugin-types qmltooling,generic --no-ffmpeg --no-quickcontrols2fusion --no-quickcontrols2imagine --no-quickcontrols2universal deploy\SpaceConnect.exe || exit /b 1

      - name: Bundle VC++ CRT DLLs
        # vcvars (Setup MSVC) nao persiste entre steps — cada step e um processo.
        # windeployqt tambem nao acha o redist sozinho nesta VM, entao copiamos
        # as DLLs do VC143 CRT direto do diretorio do VS Build Tools.
        shell: powershell
        run: |
          $crt = Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Pasta Microsoft.VC143.CRT x64 nao encontrada no VS Build Tools' }
          Copy-Item "$($crt.FullName)\*.dll" deploy\ -Force
          Get-ChildItem deploy\ | Where-Object Name -Match 'vcruntime|msvcp' | ForEach-Object Name

      - name: Package portable zip
        shell: powershell
        run: |
          $version = (Get-Content app/version.txt).Trim()
          $out = "SpaceConnect-$version-windows-x64.zip"
          Compress-Archive -Path deploy/* -DestinationPath "../$out" -Force
          echo "ARTIFACT_NAME=SpaceConnect-$version-windows-x64" >> $env:GITHUB_ENV

      - name: Build MSI installer
        # Note: deploy\ is harvested as-is (same contents as the portable zip).
        # The VC++ redist DLLs are intentionally NOT added here: they're
        # Microsoft-signed and the project's own build-arch.bat (Bundle.wxs
        # path) avoids harvesting them into the MSI directly, relying instead
        # on the official redist installer. This simple x64-only MSI has the
        # same runtime prerequisite as the existing zip (pre-existing, unrelated
        # to this change).
        shell: cmd
        env:
          BUILD_FOLDER: ${{ github.workspace }}\desktop
          DEPLOY_FOLDER: ${{ github.workspace }}\desktop\deploy
        run: |
          msbuild -restore wix\Moonlight\Moonlight.wixproj /p:Configuration=release /p:Platform=x64 /p:MSBuildProjectExtensionsPath=%BUILD_FOLDER%\ || exit /b 1

      - name: Package MSI
        shell: powershell
        run: |
          $version = (Get-Content app/version.txt).Trim()
          $msiOut = "SpaceConnect-$version-windows-x64.msi"
          Copy-Item "Moonlight.msi" "../$msiOut"
          echo "MSI_ARTIFACT_NAME=SpaceConnect-$version-windows-x64-msi" >> $env:GITHUB_ENV

      # Setup .exe (bundle WiX Burn): bootstrapper visual que baixa o VCRedist
      # e instala o MSI — e o instalador que o cliente baixa. O bundle espera o
      # MSI em build\build-x64-release\ e referencia um pacote arm64 (que nao
      # buildamos) — copiamos um stub x64 pra satisfazer o linker.
      - name: Build setup .exe (Burn bundle)
        shell: cmd
        env:
          BUILD_FOLDER: ${{ github.workspace }}\desktop
          INSTALLER_FOLDER: ${{ github.workspace }}\desktop
        run: |
          rem O bundle le $(env.BUILD_ROOT)\build-x64-$(env.BUILD_CONFIG). O
          %CD% aqui ja e ...\desktop, entao apontamos BUILD_ROOT pra ele e
          criamos build-x64-release\ direto (sem o prefixo build\).
          set BUILD_ROOT=%CD%
          set BUILD_CONFIG=release
          mkdir build-x64-release 2>nul
          copy /Y Moonlight.msi build-x64-release\Moonlight.msi || exit /b 1
          msbuild -restore wix\MoonlightSetup\MoonlightSetup.wixproj /p:Configuration=release /p:Platform=x64 /p:MSBuildProjectExtensionsPath=%BUILD_FOLDER%\ || exit /b 1

      - name: Package setup .exe
        shell: powershell
        run: |
          $version = (Get-Content app/version.txt).Trim()
          $exeOut = "SpaceConnect-$version-windows-x64-setup.exe"
          # O Publish roda na RAIZ do workspace — joga o exe pra la.
          Copy-Item "MoonlightSetup.exe" "..\$exeOut"
          if (-not (Test-Path "..\$exeOut")) { throw "setup exe nao gerado (MoonlightSetup.exe ausente)" }

      # Artifacts finais saem via GitHub Release (repo publico
      # space-connect-releases) — actions/upload-artifact fica indisponivel
      # quando a cota de storage de artifacts da org estoura.
      - name: Publish to GitHub Releases
        shell: powershell
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $version = (Get-Content desktop/app/version.txt).Trim()
          $headers = @{ Authorization = "******"; Accept = "application/vnd.github+json" }
          $existing = @()
          try {
            $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/Spike-Corp/space-connect-releases/releases/tags/v$version"
            $existing = @($rel.assets | ForEach-Object { $_.name })
          } catch { }
          # Publica so o que ainda nao existe (idempotente; re-rodar tudo dava 422).
          $all = @("SpaceConnect-$version-windows-x64.zip", "SpaceConnect-$version-windows-x64.msi", "SpaceConnect-$version-windows-x64-setup.exe")
          $toPublish = @($all | Where-Object { $existing -notcontains $_ })
          if ($toPublish.Count -eq 0) {
            Write-Host "todos os assets ja existem, pulando publish"
          } else {
            Write-Host "publicando: $($toPublish -join ', ')"
            & ./ci/publish-release.ps1 -Tag "v$version" -Files $toPublish
          }

  windows-legacy:
    name: Windows x64 (legacy, Win7/8/8.1)
    # Qt 6 dropped support for Windows 7/8/8.1 (requires Windows 10+), which is
    # why users on those OSes can't run the regular Space Connect build. This
    # job builds a second client with Qt 5.15 (last LTS supporting Win7 SP1+
    # and Win8/8.1) so those users have a working option.
    runs-on: [self-hosted, Windows, x64]
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch launcher upload endpoint
        # launcherapi.cpp apontava o upload pra /api/user/session/upload (JWT do site)
        # com token launcher → 401 "User not found". Garante a rota launcher no binário
        # mesmo se o checkout vier de commit antigo sem o fix.
        shell: cmd
        run: |
          powershell -NoProfile -Command "(Get-Content app/backend/launcherapi.cpp -Raw) -replace [regex]::Escape('kApiBase.resolved(QUrl(QStringLiteral("""/api/user/session/upload""")))'), 'kApiBase.resolved(QUrl(QStringLiteral("""session/upload""")))' | Set-Content app/backend/launcherapi.cpp -NoNewline"
          findstr /C:"session/upload" app\backend\launcherapi.cpp || exit /b 1

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 5.15 (legacy)
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Build (Release, x64, Qt5)
        shell: cmd
        run: |
          qmake moonlight-qt.pro CONFIG+=release || exit /b 1
          scripts\jom.exe release || exit /b 1

      - name: Deploy
        shell: cmd
        run: |
          mkdir deploy || exit /b 1
          copy /Y app\release\SpaceConnect.exe deploy\ || exit /b 1
          copy /Y libs\windows\lib\x64\*.dll deploy\ || exit /b 1
          copy /Y AntiHooking\release\AntiHooking.dll deploy\ || exit /b 1
          rem Discord Rich Presence: sem a discord-rpc.dll no pacote, o Discord_Initialize
          rem morre silenciosamente e o status nunca aparece (windeployqt nao cobre DLLs nao-Qt)
          copy /Y libs\windows\lib\x64\discord-rpc.dll deploy\ || exit /b 1
          copy /Y app\SDL_GameControllerDB\gamecontrollerdb.txt deploy\ || exit /b 1
          windeployqt --release --qmldir app\gui --no-opengl-sw --no-sql deploy\SpaceConnect.exe || exit /b 1

      - name: Bundle VC++ CRT DLLs
        # vcvars (Setup MSVC) nao persiste entre steps — cada step e um processo.
        # windeployqt tambem nao acha o redist sozinho nesta VM, entao copiamos
        # as DLLs do VC143 CRT direto do diretorio do VS Build Tools.
        shell: powershell
        run: |
          $crt = Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Pasta Microsoft.VC143.CRT x64 nao encontrada no VS Build Tools' }
          Copy-Item "$($crt.FullName)\*.dll" deploy\ -Force
          Get-ChildItem deploy\ | Where-Object Name -Match 'vcruntime|msvcp' | ForEach-Object Name

      - name: Package portable zip
        shell: powershell
        run: |
          $version = (Get-Content app/version.txt).Trim()
          $out = "SpaceConnect-$version-windows-legacy-x64.zip"
          Compress-Archive -Path deploy/* -DestinationPath "../$out" -Force
          echo "ARTIFACT_NAME=SpaceConnect-$version-windows-legacy-x64" >> $env:GITHUB_ENV

      - name: Build MSI installer
        # Same UpgradeCode as the regular Windows MSI is intentional here: the
        # legacy build only targets OSes (Win7/8/8.1) that can't run the
        # regular Qt6 build in the first place, so there's no realistic
        # same-machine collision between the two installers.
        shell: cmd
        env:
          BUILD_FOLDER: ${{ github.workspace }}\desktop
          DEPLOY_FOLDER: ${{ github.workspace }}\desktop\deploy
        run: |
          msbuild -restore wix\Moonlight\Moonlight.wixproj /p:Configuration=release /p:Platform=x64 /p:MSBuildProjectExtensionsPath=%BUILD_FOLDER%\ || exit /b 1

      - name: Package MSI
        shell: powershell
        run: |
          $version = (Get-Content app/version.txt).Trim()
          $msiOut = "SpaceConnect-$version-windows-legacy-x64.msi"
          Copy-Item "Moonlight.msi" "../$msiOut"
          echo "MSI_ARTIFACT_NAME=SpaceConnect-$version-windows-legacy-x64-msi" >> $env:GITHUB_ENV

      # Setup .exe legado (Win7/8/8.1): usa o bundle SEM a trava Win10 e SEM
      # o pacote arm64 (MoonlightSetupLegacy), apontando pro mesmo MSI gerado acima.
      - name: Build setup .exe legado (Burn bundle)
        shell: cmd
        env:
          BUILD_FOLDER: ${{ github.workspace }}\desktop
          INSTALLER_FOLDER: ${{ github.workspace }}\desktop
        run: |
          set BUILD_ROOT=%CD%
          set BUILD_CONFIG=release
          mkdir build-x64-release 2>nul
          copy /Y Moonlight.msi build-x64-release\Moonlight.msi || exit /b 1
          msbuild -restore wix\MoonlightSetupLegacy\MoonlightSetupLegacy.wixproj /p:Configuration=release /p:Platform=x64 /p:MSBuildProjectExtensionsPath=%BUILD_FOLDER%\ || exit /b 1

      - name: Package setup .exe legado
        shell: powershell
        run: |
          $version = (Get-Content app/version.txt).Trim()
          $exeOut = "SpaceConnect-$version-windows-legacy-x64-setup.exe"
          # O Publish roda na RAIZ do workspace — joga o exe pra la.
          Copy-Item "MoonlightSetupLegacy.exe" "..\$exeOut"
          if (-not (Test-Path "..\$exeOut")) { throw "setup exe legado nao gerado (MoonlightSetupLegacy.exe ausente)" }

      - name: Publish to GitHub Releases
        shell: powershell
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $version = (Get-Content desktop/app/version.txt).Trim()
          $headers = @{ Authorization = "******"; Accept = "application/vnd.github+json" }
          $existing = @()
          try {
            $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/Spike-Corp/space-connect-releases/releases/tags/v$version"
            $existing = @($rel.assets | ForEach-Object { $_.name })
          } catch { }
          $all = @("SpaceConnect-$version-windows-legacy-x64.zip", "SpaceConnect-$version-windows-legacy-x64.msi", "SpaceConnect-$version-windows-legacy-x64-setup.exe")
          $toPublish = @($all | Where-Object { $existing -notcontains $_ })
          if ($toPublish.Count -eq 0) {
            Write-Host "todos os assets legados ja existem, pulando publish"
          } else {
            Write-Host "publicando: $($toPublish -join ', ')"
            & ./ci/publish-release.ps1 -Tag "v$version" -Files $toPublish
          }


  macos:
    name: macOS universal
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install create-dmg
        run: |
          brew install node || true
          npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.7.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Build universal DMG (Release)
        run: bash scripts/generate-dmg.sh Release

      - name: Publish to GitHub Releases
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          version=$(tr -d '[:space:]' < app/version.txt)
          dmg=$(ls build/installer-Release/SpaceConnect-*.dmg | head -n1)
          bash ../ci/publish-release.sh "v${version}" "$dmg"

  linux:
    name: Linux AppImage (x86_64)
    # Self-hosted: GitHub-hosted minutes for private repos hit the org spending
    # limit; the kvm-builder runner builds this for free. It runs AlmaLinux, so
    # the job goes inside an ubuntu:22.04 container to keep apt as the
    # package manager (the runner injects its own node into the container).
    runs-on: [self-hosted, Linux, X64]
    container: ubuntu:22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        # Precisa rodar ANTES do Install Qt: o install-qt-action chama sudo pra
        # install-deps, e o container ubuntu:22.04 nao vem com sudo.
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libsdl2-dev libsdl2-ttf-dev libopus-dev libssl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libva-dev libvdpau-dev libdrm-dev \
            libx11-dev libxext-dev libxrandr-dev libxkbcommon-dev \
            libfuse2 wget curl ca-certificates file xz-utils \
            git p7zip-full unzip python3 sudo

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install linuxdeploy
        run: |
          SUDO=$(command -v sudo || true)
          cd /usr/local/bin
          $SUDO wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          $SUDO wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          $SUDO chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Build AppImage
        env:
          # CI runners have no FUSE; make bundled AppImage tools extract-and-run.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bash scripts/build-appimage.sh

      - name: Package AppImage
        run: |
          version=$(tr -d '[:space:]' < app/version.txt)
          src=$(ls build/installer-release/*.AppImage | head -n1)
          out="SpaceConnect-${version}-x86_64.AppImage"
          cp "$src" "$out"
          echo "APPIMAGE_ARTIFACT_NAME=SpaceConnect-${version}-linux-appimage" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          version=$(tr -d '[:space:]' < app/version.txt)
          bash ../ci/publish-release.sh "v${version}" "SpaceConnect-${version}-x86_64.AppImage"
